name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予编译脚本权限
        run: chmod +x gradlew

      - name: 编译生成 APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Blancall-安装包
          path: app/build/outputs/apk/debug/*.apk
